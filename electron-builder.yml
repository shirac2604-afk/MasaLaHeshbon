appId: il.co.maftehot.masa-la-heshbon
productName: מסע לחשבון
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: MasaLaHeshbon-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: מסע לחשבון
